[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/padcom/risc-vm"

[workspace.dependencies]
rv-isa = { path = "crates/rv-isa" }
rv-core = { path = "crates/rv-core" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
too_many_arguments = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
debug = "line-tables-only"

# Emulator code is unusably slow at opt-level 0; keep debug builds fast enough to boot things.
[profile.dev]
opt-level = 1

[profile.test]
opt-level = 2
