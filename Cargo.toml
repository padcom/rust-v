[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/padcom/rust-v"

[workspace.dependencies]
rv-isa = { path = "crates/rv-isa" }
rv-softfloat = { path = "crates/rv-softfloat" }
rv-core = { path = "crates/rv-core" }
rv-elf = { path = "crates/rv-elf" }
rv-machine = { path = "crates/rv-machine" }
rv-jit = { path = "crates/rv-jit" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
too_many_arguments = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
debug = "line-tables-only"

# Emulator code is unusably slow at opt-level 0; keep debug builds fast enough to boot things.
[profile.dev]
opt-level = 1

[profile.test]
opt-level = 2
