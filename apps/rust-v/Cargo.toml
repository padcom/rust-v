[package]
name = "rust-v"
description = "RISC-V RVA23 system emulator"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", default-features = false, features = ["windows"] }
rv-machine.workspace = true
cpal = { version = "0.18.2", optional = true }
softbuffer = "0.4.8"
toml = "1.1.8"
winit = "0.30"
arboard = { version = "3.7.0", default-features = false, optional = true }
sha2 = "0.11.1"
liblzma = { version = "0.4.8", features = ["static"] }
tar = { version = "0.4.46", default-features = false }

[features]
default = ["audio", "clipboard"]
# Plays the guest's sound through the host (needs ALSA development files on Linux).
audio = ["dep:cpal"]
# Shares the clipboard with the guest's SPICE agent.
clipboard = ["dep:arboard"]

[lints]
workspace = true
