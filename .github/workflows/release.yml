name: Release

on:
  push:
    tags: ["v[0-9]*", "[0-9]*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tag is the version: 0.2.0 or v0.2.0 (pre-releases like 0.2.0-rc.1) builds 0.2.0
  # whatever Cargo.toml says, so the two cannot disagree. Untagged runs keep Cargo.toml's.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::tag $GITHUB_REF_NAME is not a version (MAJOR.MINOR.PATCH[-PRERELEASE])"
              exit 1
            fi
          else
            version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

  firmware:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/build-guest-images.sh && scripts/build-uboot.sh
        env:
          CONTAINER_ENGINE: docker
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            third_party/guest/fw_dynamic.bin
            third_party/guest/u-boot.bin

  build:
    needs: [version, firmware]
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu, so the binaries need only glibc 2.35.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    # Signing and notarizing macOS builds; each step is skipped when its secrets are not set.
    # MACOS_CERTIFICATE is a base64 .p12 with the Developer ID Application certificate (and
    # the Developer ID Installer one for signed .pkg files).
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # Pinned appimagetool and AppImage runtime; the runner has no FUSE, so the tool runs
      # extracted.
      - name: Install appimagetool
        if: runner.os == 'Linux'
        working-directory: ${{ runner.temp }}
        run: |
          arch="${{ matrix.target }}" && arch="${arch%%-*}"
          curl -sSfLO "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-$arch.AppImage"
          curl -sSfLO "https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-$arch"
          grep -- "-$arch" <<'SUMS' | sha256sum -c
          ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool-x86_64.AppImage
          2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  runtime-x86_64
          f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158  appimagetool-aarch64.AppImage
          00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444  runtime-aarch64
          SUMS
          sudo install -m 755 "appimagetool-$arch.AppImage" /usr/local/bin/appimagetool
          echo "APPIMAGE_RUNTIME=$PWD/runtime-$arch" >> "$GITHUB_ENV"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware
      - if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install WiX
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH
      - name: Set the version
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        # The first `version =` is the workspace's; perl behaves the same on every runner.
        run: perl -pi -e 's/^version = "[^"]*"/version = "$ENV{VERSION}"/ and $done++ if !$done' Cargo.toml
      - run: cargo build --release --target ${{ matrix.target }} -p rust-v
      - name: Import the signing certificate
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/pkgbuild -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
      - run: scripts/package.sh ${{ matrix.target }} firmware
        shell: bash
        env:
          REQUIRE_INSTALLERS: 1
      - name: Notarize
        if: runner.os == 'macOS' && env.APPLE_ID != ''
        run: |
          cd dist
          notarize() {
            xcrun notarytool submit "$1" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" --wait
          }
          ditto -c -k --keepParent rust-v-*/rust-v notarize.zip
          notarize notarize.zip && rm notarize.zip
          # Only a signed installer package can be notarized; stapling lets it open offline.
          if [ -n "$MACOS_INSTALLER_IDENTITY" ]; then
            notarize rust-v-*.pkg
            xcrun stapler staple rust-v-*.pkg
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: rust-v-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.AppImage
            dist/*.pkg
            dist/*.msi
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: rust-v-*
          path: dist
          merge-multiple: true
      - run: cd dist && rm -f notarize.zip && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: packaging/release-notes.md
          generate_release_notes: true
          # v1.0.0-rc.1 and the like are marked as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
